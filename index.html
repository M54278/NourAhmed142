<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة كتب كتاب أحمد ونورهان</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212; /* Dark Mode */
            color: #e0e0e0;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* واجهة الظرف والورقة */
        #envelope-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffccd5; /* بينك فاتح للواجهة */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .envelope-scene {
            position: relative;
            width: 320px;
            height: 220px;
        }

        .envelope-pocket {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background-color: #c68b59;
            border-radius: 0 0 12px 12px;
            z-index: 3;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .letter {
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 280px;
            height: 180px;
            background-color: #fff0f3;
            color: #333;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 2;
            font-family: 'Amiri', serif;
            transform: translateY(90px);
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .letter h2 {
            font-size: 22px;
            color: #b76e79;
            margin-bottom: 10px;
        }

        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 110px solid #a66e38;
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 4;
        }

        .envelope-scene.open .envelope-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .envelope-scene.open .letter {
            transform: translateY(-50px);
            z-index: 5;
        }

        .hide-envelope {
            opacity: 0;
            visibility: hidden;
        }

        /* محتوى الدعوة الرئيسي (Dark Mode) */
        #main-content {
            display: none;
            width: 100%;
            max-width: 480px;
            padding: 30px 20px;
            text-align: center;
            animation: fadeIn 1.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-header {
            font-family: 'Amiri', serif;
            font-size: 26px;
            color: #ffb3c6;
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .quran-box {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .quran-box p {
            font-family: 'Amiri', serif;
            font-size: 18px;
            color: #ffccd5;
            line-height: 2.2;
        }

        .blessing-text {
            font-size: 16px;
            color: #ccc;
            margin: 20px 0;
            line-height: 1.8;
            padding: 0 10px;
        }

        /* العد التنازلي */
        .countdown-container {
            background: #1a1a1a;
            border: 1px solid #b76e79;
            border-radius: 15px;
            padding: 20px;
            margin: 25px 0;
        }

        .countdown-title {
            font-family: 'Amiri', serif;
            font-size: 22px;
            color: #ffb3c6;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .countdown-timers {
            display: flex;
            justify-content: space-around;
            font-size: 16px;
            color: #fff;
            direction: ltr;
        }

        .time-box {
            background: #242424;
            padding: 10px;
            border-radius: 8px;
            min-width: 65px;
